name: Setup Node pnpm Turbo
description: Install pnpm 10.30.3 + Node 22, restore pnpm/turbo caches, install deps

inputs:
  turbo-cache-key:
    description: Extra key segment for the local Turbo cache
    required: false
    default: default

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10.30.3

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm

    - name: Restore Turbo local cache
      uses: actions/cache@v4
      with:
        path: .turbo
        key: turbo-${{ runner.os }}-node22-${{ inputs.turbo-cache-key }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
        restore-keys: |
          turbo-${{ runner.os }}-node22-${{ inputs.turbo-cache-key }}-${{ hashFiles('pnpm-lock.yaml') }}-
          turbo-${{ runner.os }}-node22-${{ inputs.turbo-cache-key }}-
          turbo-${{ runner.os }}-node22-

    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
