# =============================================================================
# Boletera / TicketOS — entorno local reproducible
# =============================================================================
# Requisitos: Docker Compose v2 +, BuildKit, Dockerfiles en docker/*.Dockerfile
# (otro agente). Contexto de build = raíz; .dockerignore de raíz se aplica.
# Preferible para builds: docker build --ignorefile docker/.dockerignore ...
#
# Uso rápido:
#   cp .env.example .env          # luego edita REPLACE_ME_*
#   docker compose up -d postgres redis          # solo infra (pnpm en host)
#   docker compose up -d --build                 # stack completo
#   docker compose config                        # validar merge de env
#
# Puertos host:
#   Postgres 5434→5432  Redis 6379  API 4000  Web 3000  Admin 3001
#   Taquilla 3002  Worker health 4100
# =============================================================================

name: boletera

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-build: &app-build-defaults
  context: .
  # Root .dockerignore is used (Compose context). Prefer docker/.dockerignore
  # when building manually: --ignorefile docker/.dockerignore

services:
  postgres:
    image: postgres:16-alpine
    container_name: boletera-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: boletera
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      # Host 5434: native Windows PostgreSQL often occupies 5432/5433
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d boletera"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    logging: *default-logging
    networks:
      - boletera

  redis:
    image: redis:7-alpine
    container_name: boletera-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    logging: *default-logging
    networks:
      - boletera

  api:
    build:
      <<: *app-build-defaults
      dockerfile: docker/api.Dockerfile
    image: boletera-api:local
    container_name: boletera-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      API_PORT: "4000"
      API_HOST: "0.0.0.0"
      # Contenedor → servicio DNS (no uses localhost aquí)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/boletera?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/boletera?schema=public
      REDIS_URL: redis://redis:6379
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://127.0.0.1:4000}
      API_INTERNAL_URL: http://api:4000/api/v1
      JWT_SECRET: ${JWT_SECRET:-REPLACE_ME_local_dev_jwt_secret_min_32_bytes_xx}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-REPLACE_ME_local_dev_internal_api_secret}
      TICKET_QR_SECRET: ${TICKET_QR_SECRET:-REPLACE_ME_local_dev_ticket_qr_secret_min_32b}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-24h}
      REFRESH_TOKEN_EXPIRATION: ${REFRESH_TOKEN_EXPIRATION:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001,http://localhost:3002,http://127.0.0.1:3000,http://127.0.0.1:3001,http://127.0.0.1:3002}
      WEB_URL: ${WEB_URL:-http://localhost:3000}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-boletera-api}
      # Banorte
      BANORTE_MERCHANT_ID: ${BANORTE_MERCHANT_ID:-}
      BANORTE_AFFILIATION: ${BANORTE_AFFILIATION:-}
      BANORTE_TERMINAL: ${BANORTE_TERMINAL:-1}
      BANORTE_USER: ${BANORTE_USER:-}
      BANORTE_API_SECRET: ${BANORTE_API_SECRET:-}
      BANORTE_PASSWORD: ${BANORTE_PASSWORD:-}
      BANORTE_ACCOUNT_CLABE: ${BANORTE_ACCOUNT_CLABE:-}
      BANORTE_PAYWORKS_URL: ${BANORTE_PAYWORKS_URL:-https://eps.banorte.com/secure3d/Solucion3DSecure.htm}
      BANORTE_QUERY_URL: ${BANORTE_QUERY_URL:-https://eps.banorte.com/secure3d/consultaTransaccion.htm}
      BANORTE_WEBHOOK_SECRET: ${BANORTE_WEBHOOK_SECRET:-}
      BANORTE_RETURN_URL: ${BANORTE_RETURN_URL:-http://localhost:3000}
      BANORTE_CANCEL_URL: ${BANORTE_CANCEL_URL:-http://localhost:3000}
      BANORTE_API_PUBLIC_URL: ${BANORTE_API_PUBLIC_URL:-}
      # PayPal (reservado)
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      # SMTP
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-noreply@boletera.local}
      FRAUD_ALERT_EMAIL: ${FRAUD_ALERT_EMAIL:-}
      # AWS (reservado)
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MICROSOFT_CLIENT_ID: ${MICROSOFT_CLIENT_ID:-}
      MICROSOFT_CLIENT_SECRET: ${MICROSOFT_CLIENT_SECRET:-}
      MICROSOFT_TENANT_ID: ${MICROSOFT_TENANT_ID:-common}
      OAUTH_ADMIN_REDIRECT_URI: ${OAUTH_ADMIN_REDIRECT_URI:-http://localhost:3001/login/oauth/callback}
      OAUTH_ALLOWED_REDIRECT_URIS: ${OAUTH_ALLOWED_REDIRECT_URIS:-http://localhost:3001/login/oauth/callback}
      DEMO_TENANT_SLUG: ${DEMO_TENANT_SLUG:-}
      ENABLE_FRAUD_DETECTION: ${ENABLE_FRAUD_DETECTION:-true}
      ENABLE_ANALYTICS: ${ENABLE_ANALYTICS:-true}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/api/v1/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks:
      - boletera
    extra_hosts:
      - "host.docker.internal:host-gateway"

  worker:
    build:
      <<: *app-build-defaults
      dockerfile: docker/worker.Dockerfile
    image: boletera-worker:local
    container_name: boletera-worker
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_healthy
    ports:
      - "${WORKER_HEALTH_PORT:-4100}:4100"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/boletera?schema=public
      DIRECT_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/boletera?schema=public
      REDIS_URL: redis://redis:6379
      API_INTERNAL_URL: http://api:4000/api/v1
      JWT_SECRET: ${JWT_SECRET:-REPLACE_ME_local_dev_jwt_secret_min_32_bytes_xx}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-REPLACE_ME_local_dev_internal_api_secret}
      WORKER_HEALTH_PORT: "4100"
      WORKER_AUTO_PAYOUT: ${WORKER_AUTO_PAYOUT:-false}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-30000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_MAX_IN_FLIGHT: ${WORKER_MAX_IN_FLIGHT:-4}
      WORKER_JOB_ATTEMPTS: ${WORKER_JOB_ATTEMPTS:-5}
      WORKER_BACKOFF_BASE_MS: ${WORKER_BACKOFF_BASE_MS:-2000}
      WORKER_BACKOFF_MAX_MS: ${WORKER_BACKOFF_MAX_MS:-60000}
      WORKER_INTERNAL_REQUEST_TIMEOUT_MS: ${WORKER_INTERNAL_REQUEST_TIMEOUT_MS:-15000}
      WORKER_HEALTH_CHECK_TIMEOUT_MS: ${WORKER_HEALTH_CHECK_TIMEOUT_MS:-2000}
      WORKER_READINESS_MAX_QUEUE_DEPTH: ${WORKER_READINESS_MAX_QUEUE_DEPTH:-10000}
      WORKER_SHUTDOWN_GRACE_MS: ${WORKER_SHUTDOWN_GRACE_MS:-25000}
      WORKER_QUEUE_PREFIX: ${WORKER_QUEUE_PREFIX:-ticketos}
      WORKER_QUEUE_NAME: ${WORKER_QUEUE_NAME:-worker-jobs}
      WORKER_DLQ_NAME: ${WORKER_DLQ_NAME:-worker-dlq}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: boletera-worker
      BANORTE_MERCHANT_ID: ${BANORTE_MERCHANT_ID:-}
      BANORTE_WEBHOOK_SECRET: ${BANORTE_WEBHOOK_SECRET:-}
      BANORTE_QUERY_URL: ${BANORTE_QUERY_URL:-https://eps.banorte.com/secure3d/consultaTransaccion.htm}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4100/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
    logging: *default-logging
    networks:
      - boletera
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build:
      <<: *app-build-defaults
      dockerfile: docker/web.Dockerfile
      args:
        # Inlined at Next build time — rebuild if you change these
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
    image: boletera-web:local
    container_name: boletera-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_WEB_URL: ${NEXT_PUBLIC_WEB_URL:-http://localhost:3000}
      NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-development}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: boletera-web
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging: *default-logging
    networks:
      - boletera

  admin:
    build:
      <<: *app-build-defaults
      dockerfile: docker/admin.Dockerfile
      args:
        NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:4000/api/v1}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    image: boletera-admin:local
    container_name: boletera-admin
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: "3001"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_ADMIN_API_URL: ${NEXT_PUBLIC_ADMIN_API_URL:-http://localhost:4000/api/v1}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: boletera-admin
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging: *default-logging
    networks:
      - boletera

  taquilla:
    build:
      <<: *app-build-defaults
      dockerfile: docker/taquilla.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
    image: boletera-taquilla:local
    container_name: boletera-taquilla
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: "3002"
      HOSTNAME: "0.0.0.0"
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api/v1}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_SERVICE_NAME: boletera-taquilla
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3002/",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s
    logging: *default-logging
    networks:
      - boletera

volumes:
  postgres_data:
    name: boletera_postgres_data
  redis_data:
    name: boletera_redis_data

networks:
  boletera:
    name: boletera-network
    driver: bridge
